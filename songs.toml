# Songs kpop-fly can dance. `kpop-fly extract <slug>` turns each video into choreo/<slug>.npz.
#
#   youtube    the dance video poses are taken from: one dancer, full body, fixed camera, the whole
#              choreography, dancing to the studio track
#   studio     the official audio (YouTube Music / Topic, "Provided to YouTube by JYP Entertainment").
#              The video's soundtrack is aligned to it and the poses moved onto its timeline, so the
#              dance lines up with the recording the mic will hear
#   mirrored   true for mirrored videos (dance tutorials): frames are flipped back before posing
#
# Until 2026-10-06 these came from the official 9-member group dance practices, as a per-frame
# median of every dancer (now in choreo/group/): iRw4kL1CMI8, 9uypQGzzhns, 7T4wxA2BGTo.

[fancy]
artist = "TWICE"
title = "FANCY"
youtube = "VbytAZQogH0"          # TWICE(트와이스) MOMO "FANCY" Dance Video (official TWICE channel): Momo, solo
studio = "j4OrZV_GAsI"
dancer = "Momo"

[tt]
artist = "TWICE"
title = "TT"
youtube = "Sdy5ghAD0Mo"          # TWICE(트와이스) "TT(티티)" Lisa Rhee Dance Cover
